<style>
/* Layout: one narrow column (max 760px) that reads like a phone app; a tear-off calendar leaf marks every birthday. */
:root {
  --bg: #F5F6FA; --surface: #FFFFFF; --ink: #141B2D; --muted: #5B6478; --line: #E0E4ED;
  --accent: #C8254F; --accent-ink: #FFFFFF; --accent-soft: #FBE6EC;
  --ok: #1D7F54; --ok-soft: #E2F3EA; --warn: #9A5B00; --warn-soft: #FFF1D9; --bad: #B42318; --bad-soft: #FDE8E6;
  --shadow: 0 1px 2px rgba(20,27,45,.06), 0 6px 20px rgba(20,27,45,.06);
  --f-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1220; --surface: #171C2C; --ink: #ECEFF6; --muted: #9AA3B8; --line: #2A3146;
  --accent: #F0577D; --accent-ink: #1A0710; --accent-soft: #3A1A25;
  --ok: #4CC38A; --ok-soft: #12301F; --warn: #F2B04C; --warn-soft: #33260F; --bad: #F97066; --bad-soft: #3A1714;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1220; --surface: #171C2C; --ink: #ECEFF6; --muted: #9AA3B8; --line: #2A3146;
  --accent: #F0577D; --accent-ink: #1A0710; --accent-soft: #3A1A25;
  --ok: #4CC38A; --ok-soft: #12301F; --warn: #F2B04C; --warn-soft: #33260F; --bad: #F97066; --bad-soft: #3A1714;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 19px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
header.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; box-shadow: var(--shadow); overflow-x: auto; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.tabs button { flex: 1 0 auto; border: 0; background: transparent; color: var(--muted); font: 600 14px var(--f-body); padding: 9px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
@media (max-width: 420px) { .tabs button { padding: 9px 7px; font-size: 13px; } }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
section.view { display: flex; flex-direction: column; gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.banner { border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 14px; }
.banner.info { background: var(--accent-soft); }
.banner.warn { background: var(--warn-soft); color: var(--ink); }
.banner strong { font-weight: 700; }
button, .btn { font: 600 14px var(--f-body); border-radius: 10px; padding: 10px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; min-height: 42px; }
button:hover, .btn:hover { border-color: var(--muted); }
button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary, .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
button.danger.solid { background: var(--bad); color: #fff; }
button.link { border: 0; background: none; padding: 0; min-height: 0; color: var(--accent); text-decoration: underline; }
button:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 auto; min-width: 0; }
input[type=text], input[type=search], input[type=email], input[type=tel], input[type=number], select, textarea { font: 15px var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 42px; }
textarea { min-height: 200px; resize: vertical; line-height: 1.5; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; min-height: 0; }
.item:hover { border-color: var(--accent); }
.item .who { min-width: 0; }
.item .who b { display: block; font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.item .who span { display: block; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.leaf { width: 52px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); text-align: center; background: var(--bg); font-variant-numeric: tabular-nums; }
.leaf .m { background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 2px 0; }
.leaf .d { font: 800 22px var(--f-display); padding: 2px 0 1px; }
.leaf .w { font-size: 10px; color: var(--muted); padding-bottom: 3px; text-transform: uppercase; letter-spacing: .06em; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill.today { background: var(--accent); color: var(--accent-ink); }
.pill.soon { background: var(--accent-soft); color: var(--accent); }
.pill.later { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.pill.sent { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.mile { background: var(--ink); color: var(--bg); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.empty { text-align: center; padding: 22px 10px; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 22px 16px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; border-radius: 0; min-height: 38px; padding: 8px 12px; background: var(--surface); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat div { background: var(--bg); border-radius: 10px; padding: 10px; text-align: center; }
.stat b { display: block; font: 800 24px var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
table.map { width: 100%; border-collapse: collapse; font-size: 14px; }
table.map td { padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.map td:first-child { width: 42%; font-weight: 600; }
.scrollx { overflow-x: auto; }
/* modal */
.backdrop { position: fixed; inset: 0; background: rgba(8,10,20,.55); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); color: var(--ink); width: 100%; max-width: 720px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 760px) { .backdrop { align-items: center; } .sheet { border-radius: 18px; max-height: 88vh; } }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.x { min-height: 36px; width: 36px; padding: 0; border-radius: 50%; font-size: 20px; line-height: 1; flex: none; }
.composer { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 16px; }
@media (max-width: 640px) { .composer { grid-template-columns: minmax(0, 1fr); } }
.cardimg { width: 100%; max-width: 100%; aspect-ratio: 4 / 5; border-radius: 12px; background: var(--bg); display: block; object-fit: cover; border: 1px solid var(--line); }
.contact { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.contact code { font: 600 14px var(--f-body); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; user-select: all; }
.styles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.styles button { flex-direction: column; padding: 6px; gap: 4px; font-size: 12px; }
.styles button[aria-pressed="true"] { border: 2px solid var(--accent); }
.styles img { width: 100%; aspect-ratio: 4/5; border-radius: 6px; object-fit: cover; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 99; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
.issue-list { margin: 0; padding-left: 18px; font-size: 14px; }
details summary { cursor: pointer; font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .item, button { transition: border-color .15s, background .15s; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="todayLabel"></div>
      <h1>Customer Birthday Reminder</h1>

    <span class="pill later" title="Your customer list never leaves this device">Stored on this device only</span>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-upcoming" data-view="upcoming" aria-selected="true">Upcoming</button>
    <button role="tab" id="tab-month" data-view="month" aria-selected="false">Monthly list</button>
    <button role="tab" id="tab-customers" data-view="customers" aria-selected="false">Customers</button>
    <button role="tab" id="tab-settings" data-view="settings" aria-selected="false">Settings</button>

    <button class="primary" id="bannerImport">Import my list</button>

  <section class="view" id="view-upcoming"></section>
  <section class="view" id="view-month" hidden></section>
  <section class="view" id="view-customers" hidden></section>
  <section class="view" id="view-settings" hidden></section>
</div>
<input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.pdf,.png,.jpg,.jpeg,.webp" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
"use strict";
/* ---------- constants ---------- */
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON3 = MONTHS.map(m => m.slice(0,3).toUpperCase());
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON_LOOKUP = {jan:1,january:1,januari:1,feb:2,february:2,februari:2,mar:3,march:3,mac:3,apr:4,april:4,may:5,mei:5,jun:6,june:6,jul:7,july:7,julai:7,aug:8,august:8,ogos:8,ogo:8,sep:9,sept:9,september:9,oct:10,october:10,okt:10,oktober:10,nov:11,november:11,dec:12,december:12,dis:12,disember:12};
const LANGS = { en: "English", ms: "Bahasa Melayu", zh: "中文" };
const FIELDS = [
  { key: "name", label: "Customer name", required: true, syn: ["customer name","name","client name","nama","full name","customer","client","nama pelanggan","nama penuh"] },
  { key: "company", label: "Company", syn: ["company","company name","syarikat","nama syarikat","organisation","organization","employer","business"] },
  { key: "birthday", label: "Birthday", required: true, syn: ["birthday","date of birth","dob","birth date","birthdate","tarikh lahir","d o b","bday","hari jadi","birth day"] },
  { key: "phone", label: "Phone", syn: ["phone","mobile","phone number","contact","contact no","contact number","hp","no hp","tel","telephone","handphone","whatsapp","no telefon","mobile no","mobile number","no tel"] },
  { key: "email", label: "Email", syn: ["email","e mail","email address","emel","alamat emel"] },
  { key: "am", label: "Account manager", syn: ["account manager","am","manager","agent","rm","relationship manager","advisor","adviser","consultant","servicing agent","pegawai","account officer","agent name"] },
  { key: "lang", label: "Language (optional)", syn: ["language","lang","bahasa","preferred language"] },
  { key: "preferred", label: "Preferred name (optional)", syn: ["preferred name","nickname","salutation","call name","nama panggilan"] },
];
const DEFAULT_TEMPLATES = {
  en: { subject: "Happy Birthday, {name}!", body: "Dear {name},\n\nHappy Birthday! 🎂\n\nWishing you good health, happiness and a wonderful year ahead. Thank you for your continued trust in us - it is a privilege to be part of your journey.\n\nWarm regards,\n{am}" },
  ms: { subject: "Selamat Hari Jadi, {name}!", body: "Yang dihormati {name},\n\nSelamat Hari Jadi! 🎂\n\nSemoga anda sentiasa dikurniakan kesihatan yang baik, kebahagiaan dan kejayaan pada tahun yang mendatang. Terima kasih atas kepercayaan anda yang berterusan - kami amat menghargai hubungan ini.\n\nSalam hormat,\n{am}" },
  zh: { subject: "{name}，生日快乐！", body: "亲爱的{name}：\n\n祝您生日快乐！🎂\n\n愿您身体健康、幸福美满，新的一岁万事顺意。感谢您一直以来的信任与支持，能陪伴您走过每一段旅程，是我们的荣幸。\n\n{am} 敬上" },
  zht: { subject: "{name}，生日快樂！", body: "親愛的{name}：\n\n祝您生日快樂！🎂\n\n願您身體健康、幸福美滿，新的一歲萬事順意。感謝您一直以來的信任與支持，能陪伴您走過每一段旅程，是我們的榮幸。\n\n{am} 敬上" },
};
const CARD_TEXT = {
  en: { head: "Happy Birthday", line: "Wishing you a year of good health, happiness and success.", sign: "With warm wishes" },
  ms: { head: "Selamat Hari Jadi", line: "Semoga sentiasa sihat, bahagia dan dirahmati sepanjang tahun.", sign: "Ikhlas daripada" },
  zh: { head: "生日快乐", line: "身体健康 · 万事如意 · 岁岁平安", sign: "敬贺" },
  zht: { head: "生日快樂", line: "身體健康 · 萬事如意 · 歲歲平安", sign: "敬賀" },
};
const STYLES = { hibiscus: "Hibiscus", confetti: "Confetti", songket: "Songket" };
const STORE_KEY = "cbr.v1";

/* ---------- state ---------- */
let S = defaultState();
function defaultState() {
  return {
    customers: [], skipped: [], sent: {}, isExample: true,
    settings: { defaultLang: "en", zhScript: "zh", style: "hibiscus", windowDays: 3, senderLine: "", fallbackSender: "", templates: JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)), pdfLangs: { en: true, ms: true, zh: true } },
  };
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const d = JSON.parse(raw); S = Object.assign(defaultState(), d); S.settings = Object.assign(defaultState().settings, d.settings || {}); return true; }
  } catch (e) {}
  return false;
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- capabilities ---------- */
const capDownloads = window.claude ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null);
const capSample = window.claude ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const clean = v => String(v ?? "").replace(/\s+/g, " ").trim();
function today() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
const leap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
const dim = (m, y) => [31, leap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
const daysBetween = (a, b) => Math.round((b - a) / 864e5);
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
function rng(seed) { let s = parseInt(seed, 36) || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 10000) / 10000; }; }
function fmtDate(dt, withYear = true) { return `${DOW[dt.getDay()]}, ${dt.getDate()} ${MONTHS[dt.getMonth()].slice(0,3)}${withYear ? " " + dt.getFullYear() : ""}`; }
function fmtDob(dob) { if (!dob) return "-"; return `${dob.d} ${MONTHS[dob.m - 1].slice(0,3)}${dob.y ? " " + dob.y : ""}`; }
function fmtPhone(p) { if (!p) return ""; if (p.startsWith("60")) { const r = p.slice(2); return "+60 " + (r.length > 8 ? r.slice(0, 2) + "-" + r.slice(2, 5) + " " + r.slice(5) : r.slice(0, 1) + "-" + r.slice(1, 5) + " " + r.slice(5)); } return "+" + p; }
let toastTimer;
function toast(msg) { let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2800); }

/* ---------- birthday parsing ---------- */
function fixY(s) { const n = +s; if (s.length === 4) return n; const cy = new Date().getFullYear() % 100; return n <= cy ? 2000 + n : 1900 + n; }
function mk(d, m, y, extra = {}) {
  if (!(m >= 1 && m <= 12) || !(d >= 1 && d <= dim(m, y || 2000))) return { error: "Not a real date" };
  const cy = new Date().getFullYear();
  if (y && (y < 1900 || y > cy)) y = null;
  return Object.assign({ d, m, y: y || null }, extra);
}
function parseDOB(v, fmt) {
  if (v == null || clean(v) === "") return { error: "Birthday missing" };
  if (typeof v === "number") {
    if (v > 0 && v < 80000 && window.XLSX) { const p = XLSX.SSF.parse_date_code(v); if (p) return mk(p.d, p.m, p.y); }
    v = String(v);
  }
  if (v instanceof Date) return mk(v.getDate(), v.getMonth() + 1, v.getFullYear());
  const raw = clean(v);

/* ---------- ICS (only where real file downloads work) ---------- */
function buildICS() {
  const pad = n => String(n).padStart(2, "0"), ymd = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());

    const bd = nextBday(c, t), rem = prepBy(bd), end = new Date(rem); end.setDate(end.getDate() + 1);
    L.push("BEGIN:VEVENT", `UID:${c.id}-remind@cbr`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${ymd(rem)}`, `DTEND;VALUE=DATE:${ymd(end)}`, "RRULE:FREQ=YEARLY", `SUMMARY:${escI(`Birthday in ${S.settings.windowDays} days: ${c.name}`)}`, `DESCRIPTION:${escI(`${c.name}${c.company ? " (" + c.company + ")" : ""} - birthday ${c.dob.d} ${MONTHS[c.dob.m - 1]}. Open Customer Birthday Reminder to prepare the wish. AM: ${sender(c)}`)}`, "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:Birthday reminder", "TRIGGER:PT9H", "END:VALARM", "END:VEVENT");
  }
  const first = new Date(t.getFullYear(), t.getMonth() + 1, 1), fe = new Date(first); fe.setDate(2);
  L.push("BEGIN:VEVENT", "UID:monthly-run@cbr", `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${ymd(first)}`, `DTEND;VALUE=DATE:${ymd(fe)}`, "RRULE:FREQ=MONTHLY", "SUMMARY:Download this month's customer birthday PDF", "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:Monthly birthday list", "TRIGGER:PT9H", "END:VALARM", "END:VEVENT", "END:VCALENDAR");
  return L.join("\r\n");
}

      <label class="field">Phone (WhatsApp)<input type="tel" id="e-phone" value="${esc(c.phone ? "+" + c.phone : "")}" placeholder="e.g. 012-345 6789"></label>

    </div>
    <p class="small muted" id="e-err" role="alert"></p>

    const err = sh.querySelector("#e-err");

    if (d || m) { const p = mk(d, m, y); if (p.error) { err.textContent = "That birthday isn't a real date. Please check the day and month."; return; } dob = { d: p.d, m: p.m, y: p.y }; }
    const ph = normPhone(v("#e-phone")), em = normEmail(v("#e-email"));
    if (v("#e-phone") && !ph.phone) { err.textContent = ph.note + ". Use a format like 012-345 6789 or +60 12-345 6789."; return; }
    if (v("#e-email") && !em.email) { err.textContent = em.note; return; }
    if (!clean(v("#e-name"))) { err.textContent = "Customer name can't be empty."; return; }
    const next = { name: clean(v("#e-name")), preferred: clean(v("#e-pref")), company: clean(v("#e-company")), am: clean(v("#e-am")), lang: v("#e-lang"), dob, phone: ph.phone, email: em.email };
    const labels = { name: "Name", preferred: "Preferred name", company: "Company", am: "Account manager", lang: "Language", dob: "Birthday", phone: "Phone", email: "Email" };

    const changes = Object.keys(next).filter(k => JSON.stringify(next[k] || null) !== JSON.stringify(c[k] || null)).map(k => `${labels[k]}: ${show(k, c[k])} → ${show(k, next[k])}`);
    if (!changes.length) { closeSheet(sh); return; }
    if (!(await confirmBox("Save these changes?", changes.join("\n"), "Save"))) return;
    Object.assign(c, next, { phoneNote: ph.note && ph.phone ? null : ph.note, emailNote: null, dobError: dob ? null : "Birthday missing" });
    validate(c); save(); closeSheet(sh); renderAll(); toast("Saved");
  };

    S.customers = S.customers.filter(x => x.id !== c.id); save(); closeSheet(sh); renderAll(); toast("Customer deleted");
  };
}

  const o = e.target.closest("[data-open]"); if (o) { openComposer(o.dataset.open, +o.dataset.y); return; }
  const ed = e.target.closest("[data-edit]"); if (ed) { openEditor(ed.dataset.edit); return; }
  const g = e.target.closest("[data-goto]"); if (g) { if (g.dataset.filter) custFilter = g.dataset.filter; renderCustomers(); show(g.dataset.goto); }
});
$("#bannerImport").onclick = () => { show("customers"); $("#fileInput").click(); };
$("#fileInput").onchange = e => { handleFile(e.target.files[0]); e.target.value = ""; };
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
$("#todayLabel").textContent = fmtDate(today());
if (!load()) { S.customers = exampleCustomers(); S.isExample = true; }
else if (S.isExample) S.customers = exampleCustomers();
const hashView = (location.hash || "").slice(1); if (["upcoming", "month", "customers", "settings"].includes(hashView)) current = hashView;
renderAll(); show(current);
window.CBR = { importTable: t => importPreview(t), readSpreadsheet, buildFromRows, guessMap, buildMonthPDF, parseDOB, normPhone, state: () => S };

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
